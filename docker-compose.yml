services:
  postgres:
    image: postgres:16-alpine
    container_name: commerce-postgres
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
      POSTGRES_DB: commerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: commerce-redis
    ports:
      - "6379:6379"

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: commerce-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"

  api:
    build:
      context: ./apps/api
    container_name: commerce-api
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://commerce:commerce@postgres:5432/commerce
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - postgres
      - redis
      - redpanda
    ports:
      - "4000:4000"

  worker:
    build:
      context: ./apps/worker
    container_name: commerce-worker
    environment:
      DATABASE_URL: postgresql://commerce:commerce@postgres:5432/commerce
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - postgres
      - redpanda

  nginx:
    image: nginx:alpine
    container_name: commerce-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data: